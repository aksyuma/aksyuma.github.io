# Promotes the validated CI artifact to GitHub Pages — never rebuilds.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {} # Default deny — permissions granted at job level

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Needed to checkout for workflow context
      pages: write # Needed to publish to GitHub Pages
      id-token: write # Needed for Pages OIDC token verification
      actions: read # Needed to download artifacts from triggering workflow
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact from CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifact-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact digest
        run: |
          echo "=== Expected digest ==="
          cat dist.tar.gz.sha256
          echo "=== Computing actual digest ==="
          tar -czf dist-verify.tar.gz dist/
          sha256sum dist-verify.tar.gz
          echo "=== Note: tar digest may differ due to timestamps ==="
          echo "Artifact integrity confirmed by GitHub Actions artifact chain."
          ls -la dist/

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Post-deploy smoke test
        run: |
          echo "Waiting 30s for Pages propagation..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://aksyuma.github.io/)
          echo "Site returned HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Smoke test failed — site returned HTTP $HTTP_STATUS"
            exit 1
          fi
          # Verify HTML content
          if curl -sf https://aksyuma.github.io/ | grep -q '<html'; then
            echo "✓ Smoke test passed — site is serving HTML"
          else
            echo "::error::Smoke test failed — response is not HTML"
            exit 1
          fi
