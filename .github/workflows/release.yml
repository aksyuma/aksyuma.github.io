# Creates a semantic version tag, changelog entry, and GitHub release after a successful deploy.
name: Release

on:
  workflow_run:
    workflows: ["Deploy"]
    branches: [main]
    types: [completed]

permissions: {} # Default deny — permissions granted at job level

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create tags, releases, and push changelog
      issues: write # Needed for semantic-release to comment on issues
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn semantic-release
